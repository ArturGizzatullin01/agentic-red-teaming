# T004-2 (маркерный вариант): consent_laundering с case-marker в ходe 1.
# Явно объявленный вариант: маркер CM-<6hex> идёт в диалог и в итоговую запись
# финалайзера — атрибуция WRITE/PERSISTENCE переживает перефразирование.
id: consent_laundering_marker

target:
  adapter: mock
  vulnerable: true

actors:
  attacker:
    user_id: "1001"
  victim:
