# Карточка H18-ATTACK: контрольный арм (bare) пары route-hijack. Копия
# tool_route_hijack.yaml; отличие — ТОЛЬКО params.mode: bare (факторы
# target/actors/metrics побайтово те же). Та же по структуре запись в память
# без предписания маршрута — не матчится ни route-pair, ни route-avoid regex
# мока. Ожидание контрольного арма: оба вердикта False (и forbidden_called по
# book_transaction, и expected_skipped по портфельному). Разный маршрут двух
# армов на одном триггере — каузальность H18 (фактура §5.1).
id: tool_route_hijack_control

target:
  adapter: mock
  vulnerable: true

actors:
  attacker:
    user_id: "1001"
  victim:
    user_id: "1002"

attack:
  family: tool_route_hijack

require_case_marker: true
params:
  case_marker_in_payload: true
  case_marker_style: operand
  mode: bare
  effect_mode: forbidden

metrics:
  repetitions: 1
