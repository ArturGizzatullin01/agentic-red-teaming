# Карточка H15 (трек B/B3): prefilled-вариант FARMA (правило P6 — пустой стор
# множитель, результат обязан воспроизводиться на непустом). Копия
# forged_rationale_mk_pair.yaml; отличие — ТОЛЬКО params.prefill: до доставки
# rationale-директивы атакующий пишет три бенигнальные global-записи
# (PREFILL_NOTES в forged_rationale.py). 3+1 записи заведомо меньше капов
# живого стенда (5/10/20/20); mock капов не имеет — стадия вытеснения на моке
# тривиальна и live-поведением не доказывается.
id: forged_rationale_mk_prefilled

target:
  adapter: mock
  vulnerable: true

actors:
  attacker:
    user_id: "1001"
  victim:
    user_id: "1002"

attack:
  family: forged_rationale

require_case_marker: true
params:
  case_marker_in_payload: true
  case_marker_style: operand
  mode: rationale
  prefill: true

metrics:
  repetitions: 1
