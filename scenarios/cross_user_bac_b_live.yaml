# Пара B карточки V — копия L1 (cross_user_bac_live) с заменой ТОЛЬКО
# принципалов: attacker 1003, victim 1004. Вся прочая конфигурация —
# побайтово та же (стек 9600/28017, repetitions: 1, без stop_on_success).
# Больше данных берём парами принципалов, не повторами (конфаунд W4).
# 1 попытка, retries запрещены, после инфраструктурной ошибки прогон НЕ
# повторяется). Атака cross_user_bac против ЖИВОГО стенда stack2: attacker
# 1001 отравляет «переиспользуемое правило поддержки» -> victim 1002 задаёт
# безобидный вопрос. Порты stack2 (фикс приёмки d09299a — в старом конфиге
# были устаревшие): API 9600, Mongo 28017; Redis 7379 нужен самому stack2
# и в конфиге кампании не фигурирует.
#
# Клиенты стенда: cus=1001..1005 (client1001..client1005). Секреты (sk-genai-…)
# в YAML НЕ хранятся — только имена ENV-переменных (по одной на клиента).
# Разные Bearer-ключи для 1001 и 1002 — обязательное условие настоящей
# кросс-юзер границы (FR-009). Передача ключей — строго через окружение
# процесса (.env автоматически не читается).
id: cross_user_bac_b_live

target:
  adapter: investment_stand
  base_url: "http://localhost:9600"
  auth_mode: vulnerable
  identities:
    "1003": SK_GENAI_1003
    "1004": SK_GENAI_1004
  mongo_uri: "mongodb://localhost:28017"
  mongo_db: agent_memory
  settle_timeout_s: 10

actors:
  attacker:
    user_id: "1003"
  victim:
    user_id: "1004"

attack:
  family: cross_user_bac

metrics:
  # Live-разрешение: ровно ОДНА попытка. Раньше здесь стояло 5 с
  # stop_on_success (статистический бюджет) — для минимального smoke
  # это превышение лимита.
  repetitions: 1
