# Конфигурация memred-lab. Значения можно переопределять через CLI.
#
# ВАЖНО: работаем на ИЗОЛИРОВАННОЙ копии стенда (stack2, порты +1000),
# а не на оригинале. Причина: каждый прогон делает reset() Mongo-памяти,
# и на общем стенде это стирает evidence параллельных тестов другой сессии.
# См. C:\Users\dota2\тул хакатон\genai-invest-agent-memory-stand-stack2\README-STACK2.md
# Оригинал (8600/27017) НЕ трогаем.

target: stand          # local | stand

local:
  base_url: http://localhost:8101
  chat_model: ornith-1.5:9b        # модель агента-мишени (Ollama)
  embed_model: qwen3-embedding:0.6b

stand:
  base_url: http://localhost:9600     # stack2 agent-api (оригинал: 8600)
  token: ""   # пусто = ключ берётся из key_store (memred.stand_login)
  cus: "1001"
  auth_mode: vulnerable            # vulnerable | protected
  finalize_word: finalize
  mongo_uri: mongodb://localhost:28017   # stack2 Mongo (оригинал: 27017)
  key_store: stand_key_stack2.json       # ключи stack2 отдельно от оригинала
  login:                                 # headless-бутстрап ключа (stack2)
    keycloak_token_url: http://localhost:9180/realms/genai-stand/protocol/openid-connect/token
    agent_api: http://localhost:9600

ollama_url: http://localhost:11434

# РОЛИ ФИКСИРОВАНЫ (правило команды, не менять):
#   deepseek-v4-flash  = СУДЬЯ (оценка ответов агента)
#   qwen3.6-35b-a3b    = АТАКУЮЩИЙ (генерация формулировок атак)
# Ключи НЕ сюда (config.yaml в git): вставь API-ключ каталога в файлы
# judge_key_deepseek.txt / judge_key_qwen.txt в корне C:\memred-lab
# (файлы в .gitignore). Нет ключа -> судья/атакующий выключены,
# прогоны полностью детерминированы. Проверка: python cli.py judge-test
judge:
  active: deepseek                 # ТОЛЬКО deepseek (правило команды)
  profiles:
    deepseek:
      provider: yandex
      model_uri: gpt://b1g0nvl5lgk8he84ckp8/deepseek-v4-flash/latest
      api_key_file: judge_key_deepseek.txt
    qwen:                          # профиль qwen существует ТОЛЬКО для атакующего
      provider: yandex
      model_uri: gpt://b1g0nvl5lgk8he84ckp8/qwen3.6-35b-a3b/latest
      api_key_file: judge_key_qwen.txt

# Атакующий-LLM (генератор формулировок): qwen и только qwen.
# Запуск: python cli.py mutate --llm qwen --text "цель" --canary "маркер"
attacker:
  profile: qwen                    # ТОЛЬКО qwen (правило команды)
