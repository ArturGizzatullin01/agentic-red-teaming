# memred: динамический сканер памяти ИИ-агентов (кейс Альфа-Банка).
# Тестируемый агент ВНЕ контейнера — memred ходит к нему по API (black-box).
#
#   docker compose run --rm memred doctor                       # самопроверка
#   docker compose run --rm memred run --all \
#       --dir attacks/stand-templates                           # батарея
#   docker compose run --rm memred chain --id CH-1-audit-exfil  # APT-цепочка
#   docker compose run --rm memred report                       # findings для ASOC
#
# Вход (смонтированы): config.yaml (эндпоинты/API-контракт мишени),
#   ключи judge_key_deepseek.txt / judge_key_qwen.txt (LLM-судья/атакующий),
#   stand_key_stack2.json (ключ стенда). Выход: ./runs, ./docs/findings.*

services:
  memred:
    build: .
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./judge_key_deepseek.txt:/app/judge_key_deepseek.txt:ro
      - ./judge_key_qwen.txt:/app/judge_key_qwen.txt:ro
      - ./stand_key_stack2.json:/app/stand_key_stack2.json:ro
      - ./runs:/app/runs
      - ./docs:/app/docs
    environment:
      - MEMRED_TARGET=stand   # local | stand — какой контракт из config.yaml
