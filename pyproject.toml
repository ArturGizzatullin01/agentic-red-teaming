[project]
name = "memnotsafe"
version = "0.1.0"
description = "Agentic Memory Red Teaming — automated pentesting of LLM-agent long-term memory."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Канал доказательства memory_snapshot читает Mongo живого стенда напрямую.
# Изолировано в adapters/investment_stand.py (ленивый импорт) — офлайн-тесты и
# mock-путь не требуют pymongo.
mongo = ["pymongo>=4.6"]

[project.scripts]
memnotsafe = "memnotsafe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["memnotsafe*"]

[tool.pytest.ini_options]
# src-layout: пакет живёт в src/, поэтому тесты запускаются без установки пакета.
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
