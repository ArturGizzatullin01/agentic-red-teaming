[project]
name = "memred"
version = "0.1.0"
description = "Agentic Memory Red Teaming — automated pentesting of LLM-agent long-term memory."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
memred = "memred.cli:main"

[tool.setuptools.packages.find]
include = ["memred*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
